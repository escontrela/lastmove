spring.application.name=lastmove
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.com.escontrela.lastmove=INFO
spring.datasource.url=jdbc:sqlite:lastmove.db?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
# Flyway startup and JavaFX persistence operations can briefly overlap. A single connection turns
# that overlap into a 30-second pool timeout; SQLite still serializes writes at the database level.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.flyway.enabled=false
lastmove.engine.sunfish.executable=/Users/davidpe/Library/Python/3.9/bin/sunfish-uci
lastmove.engine.maia.models-directory=${user.home}/.local/share/maia
lastmove.engine.maia.threads=4
