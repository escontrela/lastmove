spring.application.name=lastmove
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.com.escontrela.lastmove=INFO
spring.datasource.url=jdbc:sqlite:lastmove.db?foreign_keys=on&busy_timeout=30000&journal_mode=WAL
spring.datasource.driver-class-name=org.sqlite.JDBC
# The Lichess streams and JavaFX can briefly overlap. WAL keeps reads responsive while SQLite
# serializes writes; busy_timeout lets a writer wait for the current transaction to finish.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=30000
spring.flyway.enabled=false
lastmove.engine.sunfish.executable=/Users/davidpe/Library/Python/3.9/bin/sunfish-uci
lastmove.engine.maia.models-directory=${user.home}/.local/share/maia
lastmove.engine.maia.threads=4
